<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Exponential backoff: a client retries a failing API with growing waits until it gets a 200">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: #1d2028; stroke: #2c303a; stroke-width: 1.5; }
    .lbl { fill: #ecebe6; font-size: 13px; }
    .dim { fill: #9b978d; font-size: 11px; }
    .pkt { opacity: 0; animation: 8s linear infinite; }
    .fail { animation-name: fail; }
    .ok { animation-name: ok; }
    .tag { opacity: 0; font-size: 12px; font-weight: 700; animation: 8s linear infinite; }
    .tag-fail { fill: #ff6169; animation-name: tag-fail; }
    .tag-ok { fill: #3ccf8e; animation-name: tag-ok; }
    .head { animation: head 8s linear infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 2.2s; } .d4 { animation-delay: 5s; }
    @keyframes fail {
      0% { transform: translateX(0); opacity: 0; fill: #ff7448; }
      1% { opacity: 1; }
      8% { transform: translateX(200px); fill: #ff7448; }
      9% { fill: #ff6169; }
      14% { transform: translateX(170px); opacity: 0; fill: #ff6169; }
      100% { opacity: 0; }
    }
    @keyframes ok {
      0% { transform: translateX(0); opacity: 0; fill: #ff7448; }
      1% { opacity: 1; }
      8% { transform: translateX(200px); fill: #ff7448; }
      9%, 30% { transform: translateX(200px); opacity: 1; fill: #3ccf8e; }
      34%, 100% { transform: translateX(200px); opacity: 0; fill: #3ccf8e; }
    }
    @keyframes tag-fail { 0%, 8% { opacity: 0; } 9%, 14% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes tag-ok { 0%, 8% { opacity: 0; } 9%, 32% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes head { from { transform: translateX(0); } to { transform: translateX(320px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tag-ok { opacity: 1; } }
  </style>
  <rect width="400" height="225" rx="16" fill="#15171d"/>
  <text x="20" y="30" class="dim">// exponential backoff</text>
  <rect x="30" y="70" width="80" height="44" rx="8" class="box"/>
  <text x="70" y="97" text-anchor="middle" class="lbl">client</text>
  <rect x="290" y="70" width="80" height="44" rx="8" class="box"/>
  <text x="330" y="97" text-anchor="middle" class="lbl">api</text>
  <line x1="110" y1="92" x2="290" y2="92" stroke="#2c303a" stroke-dasharray="4 5"/>
  <circle class="pkt fail d1" cx="115" cy="92" r="6"/>
  <circle class="pkt fail d2" cx="115" cy="92" r="6"/>
  <circle class="pkt fail d3" cx="115" cy="92" r="6"/>
  <circle class="pkt ok d4" cx="115" cy="92" r="6"/>
  <text class="tag tag-fail d1" x="330" y="62" text-anchor="middle">503</text>
  <text class="tag tag-fail d2" x="330" y="62" text-anchor="middle">503</text>
  <text class="tag tag-fail d3" x="330" y="62" text-anchor="middle">503</text>
  <text class="tag tag-ok d4" x="330" y="62" text-anchor="middle">200 OK</text>
  <line x1="40" y1="170" x2="360" y2="170" stroke="#2c303a" stroke-width="2"/>
  <g fill="#ff7448"><circle cx="40" cy="170" r="4"/><circle cx="72" cy="170" r="4"/><circle cx="128" cy="170" r="4"/><circle cx="240" cy="170" r="4"/></g>
  <text x="56" y="192" text-anchor="middle" class="dim">1s</text>
  <text x="100" y="192" text-anchor="middle" class="dim">2s</text>
  <text x="184" y="192" text-anchor="middle" class="dim">4s</text>
  <text x="300" y="192" text-anchor="middle" class="dim">…8s</text>
  <line class="head" x1="40" y1="160" x2="40" y2="180" stroke="#a196ff" stroke-width="2"/>
</svg>
